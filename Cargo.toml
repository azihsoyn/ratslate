[package]
name = "ratslate"
version = "0.3.0"
edition = "2024"
description = "An infinite canvas in the terminal: boxes, arrows and text, placed with the mouse, written out as ASCII"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azihsoyn/ratslate"
homepage = "https://github.com/azihsoyn/ratslate"
readme = "README.md"
keywords = ["tui", "canvas", "whiteboard", "json-canvas", "ratatui"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui = "0.30"
ratatui-dnd = "0.1.0"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yrs = "0.27"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
